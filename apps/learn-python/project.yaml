# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/appproject_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: learn-python
  namespace: argocd
spec:
  description: "learn-python — https://github.com/dxas90/learn-python"
  sourceRepos:
    - https://github.com/dxas90/learn-python.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: learn-python
    - server: https://kubernetes.default.svc
      namespace: learn-python-preview
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: networking.x-k8s.io
      kind: HTTPRoute
