# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/applicationset_v1alpha1.json
# ArgoCD ApplicationSet — learn-python GitHub PR preview environments
#
# Prerequisites — create the Secret in the argocd namespace:
#   kubectl -n argocd create secret generic github-token \
#     --from-literal=token=<GITHUB_PAT>   # scopes: repo (read)
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: learn-python-preview
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - pullRequest:
        github:
          owner: dxas90
          repo: learn-python
          tokenRef:
            secretName: github-token
            key: token
          labels:
            - preview
        requeueAfterSeconds: 600
  syncPolicy:
    applicationsSync: sync
  template:
    metadata:
      name: "learn-python-preview-{{.number}}-{{.branch_slug}}"
      namespace: argocd
      labels:
        app.kubernetes.io/managed-by: argocd-applicationset
        preview/mr-number: "{{.number}}"
        preview/app: learn-python
    spec:
      project: learn-python
      source:
        repoURL: https://github.com/dxas90/learn-python.git
        targetRevision: "{{.head_sha}}"
        path: k8s/learn-python
        helm:
          releaseName: "learn-python-{{.number}}-{{.branch_slug}}"
          parameters:
            - name: image.repository
              value: ghcr.io/dxas90/learn-python
            - name: image.tag
              value: "{{.head_sha}}"
            - name: image.pullPolicy
              value: Always
            - name: env.variables.APP_ENV
              value: preview
      destination:
        server: https://kubernetes.default.svc
        namespace: learn-python-preview
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - FailOnSharedResource=true
