# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: learn-php
  namespace: argocd
spec:
  project: learn-php
  source:
    repoURL: https://github.com/dxas90/learn-php.git
    targetRevision: main
    path: k8s/learn-php
    helm:
      releaseName: learn-php
      parameters:
        - name: image.repository
          value: ghcr.io/dxas90/learn-php
        - name: env.variables.APP_ENV
          value: production
  destination:
    server: https://kubernetes.default.svc
    namespace: learn-php
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - FailOnSharedResource=true
