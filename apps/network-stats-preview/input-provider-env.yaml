# ResourceSetInputProvider — GitLab Environments
#
# Watches https://gitlab.com/dxas90/network-stats for GitLab
# environments whose name starts with `review/`. These are
# typically created by the CI pipeline via the `.gitlab-ci.yml`
# start-review job.
#
# The GitLab Agent (assumed installed) provides kubectl access so
# the CI can call `flux-operator reconcile` after each deployment.
# An optional webhook Receiver (see receiver-env.yaml) is also
# wired up for push-based reconciliation.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSetInputProvider
metadata:
  name: network-stats-environments
  namespace: network-stats-preview
  annotations:
    fluxcd.controlplane.io/reconcileEvery: "10m"
spec:
  type: GitLabEnvironment
  url: https://gitlab.com/dxas90/network-stats
  secretRef:
    name: gitlab-token-readonly
  filter:
    includeEnvironment: "review/.*"
  defaultValues:
    chart: "k8s/network-stats"
