# ResourceSet — GitLab Environment ephemeral environments
#
# For each active GitLab environment matching `review/.*` this
# ResourceSet generates a GitRepository + HelmRelease pair.
# The CI pipeline (start-review job) creates the environment and
# calls `flux-operator reconcile` via the GitLab Agent to trigger
# an immediate sync.  The stop-review job terminates the environment
# which causes Flux Operator to garbage-collect the resources.
#
# Available inputs per environment row:
#   inputs.slug    — URL-safe environment slug (e.g. "review-feat-login")
#   inputs.sha     — commit SHA of the latest deployment
#   inputs.branch  — source branch
#   inputs.author  — triggering user
#   inputs.title   — environment name (e.g. "review/feat-login")
#   inputs.chart   — injected by defaultValues ("k8s/network-stats")
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: network-stats-env
  namespace: network-stats-preview
spec:
  serviceAccountName: flux
  inputsFrom:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: network-stats-environments
  resources:
    - apiVersion: source.toolkit.fluxcd.io/v1
      kind: GitRepository
      metadata:
        name: "network-stats-env-<< inputs.slug >>"
        namespace: network-stats-preview
      spec:
        interval: 1h
        url: https://gitlab.com/dxas90/network-stats
        ref:
          commit: "<< inputs.sha >>"
        secretRef:
          name: gitlab-token-readonly

    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: "network-stats-env-<< inputs.slug >>"
        namespace: network-stats-preview
        annotations:
          event.toolkit.fluxcd.io/preview-url: "https://network-stats-<< inputs.slug >>.preview.example.com"
          event.toolkit.fluxcd.io/branch: "<< inputs.branch | quote >>"
          event.toolkit.fluxcd.io/author: "<< inputs.author | quote >>"
      spec:
        serviceAccountName: flux
        interval: 10m
        releaseName: "network-stats-env-<< inputs.slug >>"
        chart:
          spec:
            chart: "<< inputs.chart >>"
            reconcileStrategy: Revision
            sourceRef:
              kind: GitRepository
              name: "network-stats-env-<< inputs.slug >>"
        maxHistory: 2
        install:
          createNamespace: false
          remediation:
            retries: 3
        upgrade:
          cleanupOnFail: true
          remediation:
            retries: 3
        values:
          image:
            repository: registry.gitlab.com/dxas90/network-stats
            tag: "<< inputs.sha >>"
            pullPolicy: Always
          httproute:
            enabled: false
          env:
            variables:
              APP_ENV: preview
