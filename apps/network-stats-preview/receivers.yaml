# Webhook Receivers — trigger immediate ResourceSetInputProvider
# reconciliation when GitLab sends a push/MR/deployment event.
#
# Prerequisite: create the receiver token Secret before applying:
#   kubectl -n network-stats-preview create secret generic receiver-token \
#     --from-literal=token=<RANDOM_HEX_32>
#
# After apply, expose the Receiver service and register the webhook in
# GitLab under Settings > Webhooks with:
#   URL:    http(s)://<cluster-ingress>/hook/<receiver-token>
#   Events: Merge request events, Deployment events
---
# Receiver for GitLab MR events → reconciles the MR InputProvider
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: gitlab-mr-receiver
  namespace: network-stats-preview
spec:
  type: gitlab
  secretRef:
    name: receiver-token
  resources:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: network-stats-merge-requests
---
# Receiver for GitLab Deployment events → reconciles the Env InputProvider
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Receiver
metadata:
  name: gitlab-env-receiver
  namespace: network-stats-preview
spec:
  type: gitlab
  secretRef:
    name: receiver-token
  resources:
    - apiVersion: fluxcd.controlplane.io/v1
      kind: ResourceSetInputProvider
      name: network-stats-environments
