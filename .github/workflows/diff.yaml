# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: diff

on:
  pull_request:
    branches: [main]
    paths:
      - 'clusters/**'
      - 'infrastructure/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  diff:
    name: Diff ${{ matrix.cluster }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cluster: [staging, prod]
      fail-fast: false
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: pull

      - name: Checkout base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: base

      - name: Diff HelmReleases — ${{ matrix.cluster }}
        uses: docker://ghcr.io/allenporter/flux-local:v8.4.0
        with:
          args: >-
            diff helmrelease
            --unified=5
            --path /github/workspace/pull/clusters/${{ matrix.cluster }}
            --source-path /github/workspace/base/clusters/${{ matrix.cluster }}
            --all-namespaces
        id: diff-helmrelease

      - name: Diff Kustomizations — ${{ matrix.cluster }}
        uses: docker://ghcr.io/allenporter/flux-local:v8.4.0
        with:
          args: >-
            diff kustomization
            --unified=5
            --path /github/workspace/pull/clusters/${{ matrix.cluster }}
            --source-path /github/workspace/base/clusters/${{ matrix.cluster }}
            --all-namespaces
        id: diff-kustomization

      - name: Post diff comment
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0  # v3.0.4
        if: always()
        with:
          header: flux-diff-${{ matrix.cluster }}
          message: |
            ### Flux diff — `${{ matrix.cluster }}`

            **HelmReleases**
            ```
            ${{ steps.diff-helmrelease.outputs.diff || 'no changes' }}
            ```

            **Kustomizations**
            ```
            ${{ steps.diff-kustomization.outputs.diff || 'no changes' }}
            ```
