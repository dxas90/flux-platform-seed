# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: flux-diff

on:
  pull_request:
    branches: [main]
    paths:
      - clusters/**
      - infrastructure/**

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  diff:
    name: ${{ matrix.cluster }} ${{ matrix.resource }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cluster: [staging, prod]
        resource: [helmrelease, kustomization]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      # flux-local is deprecated upstream in favour of home-operations/flate.
      # flate 0.6.5 resolves OCI chartRef dependencies non-deterministically
      # on this repo, so flux-local stays until that is fixed upstream.
      - uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39  # v2.9.6
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      - uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530  # v3.0.0

      - name: Diff
        id: diff
        uses: allenporter/flux-local/action/diff@92d3a538c009c3fec120fbf50f6ef33b3e0a569c  # 8.4.0
        with:
          path: clusters/${{ matrix.cluster }}
          resource: ${{ matrix.resource }}
          live-branch: ${{ github.event.repository.default_branch }}
          sources: flux-system

      - name: Comment
        if: steps.diff.outputs.diff != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88  # v3.0.5
        with:
          header: flux-diff-${{ matrix.cluster }}-${{ matrix.resource }}
          message: |
            `${{ matrix.cluster }}` ${{ matrix.resource }} diff

            ```diff
            ${{ steps.diff.outputs.diff }}
            ```

      - name: Remove stale comment
        if: steps.diff.outputs.diff == ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88  # v3.0.5
        with:
          header: flux-diff-${{ matrix.cluster }}-${{ matrix.resource }}
          delete: true
