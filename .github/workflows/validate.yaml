# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4b91a5d039d4a9d5a1  # v6

      - name: Install tools (kustomize, helm, flux)
        uses: fluxcd/flux2/action@8d5f40dca36a949a36c9a439c2f52f33a1e5f0cb  # v2.9.6
        with:
          version: 2.9.6

      - name: Install kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f  # v2
        with:
          kustomize-version: '5.8.2'

      - name: Run YAML + Kustomize validation
        run: uv run --with pyyaml==6.0.3 python scripts/validate.py

      - name: Run unit tests
        run: uv run --with pyyaml==6.0.3 python scripts/test_validate.py

      - name: Check text file hygiene
        run: uv run python scripts/check_text_files.py

  helm:
    name: Render Helm charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@6b9c6063abd6010835644d4b91a5d039d4a9d5a1  # v6

      - name: Install tools (kustomize, helm)
        uses: fluxcd/flux2/action@8d5f40dca36a949a36c9a439c2f52f33a1e5f0cb  # v2.9.6
        with:
          version: 2.9.6

      - name: Install kustomize
        uses: imranismail/setup-kustomize@2ba527d4d055ab63514ba50a99456fc35684947f  # v2
        with:
          kustomize-version: '5.8.2'

      - name: Pull and render every pinned chart
        run: uv run --with pyyaml==6.0.3 python scripts/validate.py --helm
