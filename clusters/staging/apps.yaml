# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
# Flux Kustomization — network-stats ArgoCD resources (staging)
# AppProject + Application (stable) + ApplicationSet (MR previews) + notifications config.
# Single entry: everything lives in apps/network-stats/.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: app-network-stats
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/network-stats
  prune: true
  deletionPolicy: Orphan
  wait: true
  serviceAccountName: kustomize-controller
  dependsOn:
    - name: infra-configs
