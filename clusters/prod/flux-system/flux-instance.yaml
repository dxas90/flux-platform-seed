apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 1h
    fluxcd.controlplane.io/reconcileTimeout: 10m
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  distribution:
    version: 2.9.6
    registry: ghcr.io/fluxcd
  components:
    - source-controller
    - source-watcher
    - kustomize-controller
    - helm-controller
    - notification-controller
  cluster:
    type: kubernetes
    networkPolicy: true
    domain: cluster.local
    multitenant: false
  sync:
    kind: GitRepository
    url: https://github.com/YOUR_ORG/flux-platform-seed.git
    ref: refs/tags/v0.1.0
    path: clusters/prod
  kustomize:
    patches:
      - target:
          group: kustomize.toolkit.fluxcd.io
          version: v1
          kind: Kustomization
          name: flux-system
        patch: |
          - op: add
            path: /spec/deletionPolicy
            value: Orphan
