# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/fluxinstance-fluxcd-v1.json
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
  annotations:
    fluxcd.controlplane.io/reconcileEvery: 5m
    fluxcd.controlplane.io/reconcileTimeout: 10m
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  distribution:
    version: 2.9.6
    registry: ghcr.io/fluxcd
  components:
    - helm-controller
    - image-automation-controller
    - image-reflector-controller
    - kustomize-controller
    - notification-controller
    - source-controller
    - source-watcher
  cluster:
    type: kubernetes
    networkPolicy: false
    domain: cluster.local
    multitenant: false
  sync:
    kind: GitRepository
    url: https://github.com/dxas90/flux-platform-seed.git
    ref: refs/heads/main
    path: clusters/kind
  kustomize:
    patches:
      # Ensure the Flux system Kustomization adopts existing resources on uninstall.
      - target:
          group: kustomize.toolkit.fluxcd.io
          version: v1
          kind: Kustomization
          name: flux-system
        patch: |
          - op: add
            path: /spec/deletionPolicy
            value: Orphan
      # Controller resource tuning — keeps flux-system pods within the node budget.
      - target:
          kind: Deployment
          name: kustomize-controller
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --concurrent=5
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --kube-api-qps=50
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --kube-api-burst=100
          - op: replace
            path: /spec/template/spec/containers/0/resources
            value:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 512Mi
      - target:
          kind: Deployment
          name: helm-controller
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --concurrent=5
          - op: replace
            path: /spec/template/spec/containers/0/resources
            value:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 512Mi
      - target:
          kind: Deployment
          name: source-controller
        patch: |
          - op: replace
            path: /spec/template/spec/containers/0/resources
            value:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
