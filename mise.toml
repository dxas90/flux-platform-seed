[tools]
flux2 = "2.9.6"
helm = "4.3.1"
kind = "0.33.0"
kubectl = "1.37.1"
kustomize = "5.8.3"
python = "3.15.1"
pre-commit = "4.7.0"
uv = "0.13.4"

[tasks.validate]
description = "Run text hygiene, manifest, dependency, and unit checks"
run = "python scripts/check_text_files.py && python -m unittest discover -s scripts -v && python scripts/validate.py"

[tasks."validate/helm-unit"]
description = "Run Helm unit tests for the ArgoCD and FluxCD application charts"
run = "helm unittest charts/argocd-template charts/fluxcd-template"

[tasks."validate/helm"]
description = "Download and render every pinned Helm chart"
run = "python scripts/validate.py --helm"

[tasks."validate/schemas"]
description = "Validate custom resources against Flux and operator CRDs"
run = "python scripts/validate_schemas.py --operator-version 0.61.0"

[tasks."kind/up"]
alias = ["up"]
description = "Create kind, install Flux Operator, and apply the kind FluxInstance"
run = "bash scripts/kind-up.sh"

[tasks."kind/down"]
alias = ["down"]
description = "Delete the local kind cluster"
run = "bash scripts/kind-down.sh"
