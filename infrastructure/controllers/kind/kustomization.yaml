apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
configMapGenerator:
  - name: cert-manager-values
    namespace: cert-manager
    behavior: replace
    files:
      - values.yaml=values/cert-manager.yaml
  - name: external-secrets-values
    namespace: external-secrets
    behavior: replace
    files:
      - values.yaml=values/external-secrets.yaml
  - name: metrics-server-values
    namespace: kube-system
    behavior: replace
    files:
      - values.yaml=values/metrics-server.yaml
  - name: reloader-values
    namespace: kube-system
    behavior: replace
    files:
      - values.yaml=values/reloader.yaml
  - name: keda-values
    namespace: keda
    behavior: replace
    files:
      - values.yaml=values/keda.yaml
  - name: kube-prometheus-stack-values
    namespace: observability
    behavior: replace
    files:
      - values.yaml=values/kube-prometheus-stack.yaml
  - name: grafana-operator-values
    namespace: observability
    behavior: replace
    files:
      - values.yaml=values/grafana-operator.yaml
  - name: loki-values
    namespace: observability
    behavior: replace
    files:
      - values.yaml=values/loki.yaml
  - name: fluent-bit-values
    namespace: observability
    behavior: replace
    files:
      - values.yaml=values/fluent-bit.yaml
  - name: alloy-values
    namespace: observability
    behavior: replace
    files:
      - values.yaml=values/alloy.yaml
  - name: tempo-values
    namespace: observability
    behavior: replace
    files:
      - values.yaml=values/tempo.yaml
  - name: argocd-values
    namespace: argocd
    behavior: replace
    files:
      - values.yaml=values/argocd.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
