apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  timeout: 10m
  releaseName: cert-manager
  maxHistory: 3
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: cert-manager-values
  chart:
    spec:
      chart: cert-manager
      version: v1.21.2
      sourceRef:
        kind: HelmRepository
        name: cert-manager
  postRenderers:
    - kustomize:
        patches:
          # Remove the default NetworkPolicy; cert-manager webhooks must be
          # reachable from the API server across namespaces.
          - target:
              group: networking.k8s.io
              kind: NetworkPolicy
            patch: |
              $patch: delete
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: not-used
          # Route DNS01 challenges through Cloudflare resolvers to avoid
          # split-horizon issues in private VPCs.
          - target:
              group: apps
              kind: Deployment
              name: cert-manager
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --dns01-recursive-nameservers=https://1.1.1.1:443/dns-query,https://1.0.0.1:443/dns-query
              - op: add
                path: /spec/template/spec/containers/0/args/-
                value: --dns01-recursive-nameservers-only=true
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  limits:
                    cpu: 200m
                    memory: 300Mi
                  requests:
                    cpu: 100m
                    memory: 150Mi
          - target:
              group: apps
              kind: Deployment
              name: cert-manager-cainjector
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  limits:
                    cpu: 200m
                    memory: 300Mi
                  requests:
                    cpu: 100m
                    memory: 150Mi
          - target:
              group: apps
              kind: Deployment
              name: cert-manager-webhook
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/resources
                value:
                  limits:
                    cpu: 100m
                    memory: 64Mi
                  requests:
                    cpu: 10m
                    memory: 32Mi
