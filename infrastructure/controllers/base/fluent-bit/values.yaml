kind: DaemonSet
serviceMonitor:
  enabled: false
daemonSetVolumes:
- name: varlog
  hostPath:
    path: /var/log
- name: positions
  hostPath:
    path: /var/lib/fluent-bit
    type: DirectoryOrCreate
daemonSetVolumeMounts:
- name: varlog
  mountPath: /var/log
  readOnly: true
- name: positions
  mountPath: /var/lib/fluent-bit
config:
  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*.log
        multiline.parser docker, cri
        Tag kube.*
        DB /var/lib/fluent-bit/tail.db
        Mem_Buf_Limit 20MB
        Skip_Long_Lines On
  filters: |
    [FILTER]
        Name kubernetes
        Match kube.*
        Merge_Log On
        Keep_Log Off
        Labels On

    # Opt-in Alloy pods are excluded to prevent duplicate collection.
    [FILTER]
        Name grep
        Match kube.*
        Exclude $kubernetes['labels']['logs.platform.example/collector'] ^alloy$
  outputs: |
    [OUTPUT]
        Name loki
        Match kube.*
        Host loki-gateway.observability.svc.cluster.local
        Port 80
        Labels job=fluent-bit
        Auto_Kubernetes_Labels On
        Line_Format json
        Retry_Limit False
