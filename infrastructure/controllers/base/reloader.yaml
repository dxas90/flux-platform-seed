apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: reloader
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: generic-apps
    namespace: flux-system
  path: ./apps/reloader
  targetNamespace: kube-system
  prune: true
  patches:
    - target:
        kind: HelmRelease
        name: reloader
      patch: |
        - op: add
          path: /spec/valuesFrom/-
          value:
            kind: ConfigMap
            name: reloader-overrides
