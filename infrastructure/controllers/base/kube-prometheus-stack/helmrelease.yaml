# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: observability
spec:
  interval: 30m
  timeout: 10m
  releaseName: kube-prometheus-stack
  maxHistory: 3
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    crds: CreateReplace
  valuesFrom:
  - kind: ConfigMap
    name: kube-prometheus-stack-values
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  postRenderers:
  - kustomize:
      patches:
      - target:
          group: apps
          version: v1
          kind: DaemonSet
          name: kube-prometheus-stack-prometheus-node-exporter
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/resources
            value:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: kube-prometheus-stack-kube-state-metrics
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/resources
            value:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: kube-prometheus-stack-operator
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/resources
            value:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
      - target:
          group: apps
          version: v1
          kind: StatefulSet
          name: prometheus-kube-prometheus-stack-prometheus
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/resources
            value:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
      - target:
          group: apps
          version: v1
          kind: StatefulSet
          name: alertmanager-kube-prometheus-stack-alertmanager
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/resources
            value:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 512Mi
