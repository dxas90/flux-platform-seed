apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: observability
spec:
  interval: 30m
  timeout: 10m
  releaseName: tempo
  maxHistory: 3
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    crds: CreateReplace
  valuesFrom:
  - kind: ConfigMap
    name: tempo-values
  chartRef:
    kind: OCIRepository
    name: tempo
  postRenderers:
  - kustomize:
      patches:
      - target:
          group: apps
          version: v1
          kind: StatefulSet
          name: tempo
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/resources
            value:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
