apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dragonfly-operator
  namespace: dragonfly-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: dragonfly-operator
  maxHistory: 3
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    crds: CreateReplace
  valuesFrom:
  - kind: ConfigMap
    name: dragonfly-operator-values
  chartRef:
    kind: OCIRepository
    name: dragonfly-operator
