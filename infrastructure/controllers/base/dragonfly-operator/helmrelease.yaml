apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dragonfly-operator
  namespace: dragonfly-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: dragonfly-operator
  maxHistory: 3
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    crds: CreateReplace
  valuesFrom:
  - kind: ConfigMap
    name: dragonfly-operator-values
  chartRef:
    kind: OCIRepository
    name: dragonfly-operator
  postRenderers:
  - kustomize:
      patches:
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: dragonfly-operator
        patch: |
          - op: add
            path: /spec/template/spec/containers/1/resources
            value:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 512Mi
