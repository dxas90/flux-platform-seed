apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd
  namespace: argocd
spec:
  interval: 30m
  timeout: 10m
  releaseName: argocd
  maxHistory: 3
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    crds: CreateReplace
  valuesFrom:
  - kind: ConfigMap
    name: argocd-values
  chart:
    spec:
      chart: argo-cd
      version: 10.10.3
      sourceRef:
        kind: HelmRepository
        name: argocd
