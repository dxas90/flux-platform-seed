# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd
  namespace: argocd
spec:
  interval: 30m
  timeout: 10m
  releaseName: argocd
  maxHistory: 3
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    crds: CreateReplace
  valuesFrom:
  - kind: ConfigMap
    name: argocd-values
  chart:
    spec:
      chart: argo-cd
      version: 10.10.5
      sourceRef:
        kind: HelmRepository
        name: argocd
  postRenderers:
  - kustomize:
      patches:
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: argocd-applicationset-controller
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/resources
            value:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: argocd-notifications-controller
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/resources
            value:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: argocd-repo-server
        patch: |
          - op: add
            path: /spec/template/spec/initContainers/0/resources
            value:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: argocd-repo-server
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/resources
            value:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: argocd-server
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/resources
            value:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: argocd-dex-server
        patch: |
          - op: add
            path: /spec/template/spec/initContainers/0/resources
            value:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: argocd-dex-server
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/resources
            value:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: argocd-redis
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/resources
            value:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
      - target:
          group: apps
          version: v1
          kind: StatefulSet
          name: argocd-application-controller
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/resources
            value:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
