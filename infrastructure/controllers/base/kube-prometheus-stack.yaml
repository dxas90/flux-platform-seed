apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: generic-apps
    namespace: flux-system
  path: ./apps/kube-prometheus-stack
  targetNamespace: observability
  prune: true
  patches:
    - target:
        kind: HelmRelease
        name: kube-prometheus-stack
      patch: |
        - op: add
          path: /spec/valuesFrom/-
          value:
            kind: ConfigMap
            name: kube-prometheus-stack-overrides
