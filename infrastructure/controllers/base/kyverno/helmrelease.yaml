apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  timeout: 10m
  releaseName: kyverno
  maxHistory: 3
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    crds: CreateReplace
  valuesFrom:
  - kind: ConfigMap
    name: kyverno-values
  chart:
    spec:
      chart: kyverno
      version: 3.9.1
      sourceRef:
        kind: HelmRepository
        name: kyverno
      interval: 30m
  postRenderers:
  - kustomize:
      patches:
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: kyverno-admission-controller
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/resources
            value:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 512Mi
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: kyverno-background-controller
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/resources
            value:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 512Mi
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: kyverno-cleanup-controller
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/resources
            value:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 512Mi
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: kyverno-reports-controller
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/resources
            value:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 512Mi
