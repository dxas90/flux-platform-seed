apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: observability
spec:
  dependsOn:
  - name: loki
  interval: 30m
  timeout: 10m
  releaseName: alloy
  maxHistory: 3
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    crds: CreateReplace
  valuesFrom:
  - kind: ConfigMap
    name: alloy-values
  chart:
    spec:
      chart: alloy
      version: 1.13.1
      sourceRef:
        kind: HelmRepository
        name: alloy
