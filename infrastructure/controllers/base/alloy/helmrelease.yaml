# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: observability
spec:
  dependsOn:
  - name: loki
  interval: 30m
  timeout: 10m
  releaseName: alloy
  maxHistory: 3
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    crds: CreateReplace
  valuesFrom:
  - kind: ConfigMap
    name: alloy-values
  chart:
    spec:
      chart: alloy
      version: 1.13.1
      sourceRef:
        kind: HelmRepository
        name: alloy
  postRenderers:
  - kustomize:
      patches:
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: alloy
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/resources
            value:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 512Mi
      - target:
          group: apps
          version: v1
          kind: Deployment
          name: alloy
        patch: |
          - op: add
            path: /spec/template/spec/containers/1/resources
            value:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                cpu: 100m
                memory: 128Mi
