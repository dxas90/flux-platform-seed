apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: generic-apps
    namespace: flux-system
  path: ./apps/external-secrets
  targetNamespace: external-secrets
  prune: true
  patches:
    - target:
        kind: HelmRelease
        name: external-secrets
      patch: |
        - op: add
          path: /spec/valuesFrom/-
          value:
            kind: ConfigMap
            name: external-secrets-overrides
