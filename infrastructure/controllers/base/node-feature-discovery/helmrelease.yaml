apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
  namespace: node-feature-discovery
spec:
  interval: 30m
  timeout: 10m
  releaseName: node-feature-discovery
  maxHistory: 3
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    crds: CreateReplace
  valuesFrom:
  - kind: ConfigMap
    name: node-feature-discovery-values
  chart:
    spec:
      chart: node-feature-discovery
      version: 0.19.0
      sourceRef:
        kind: HelmRepository
        name: node-feature-discovery
      interval: 30m
