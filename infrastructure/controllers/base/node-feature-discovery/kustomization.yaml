apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- source.yaml
- helmrelease.yaml
configMapGenerator:
- name: node-feature-discovery-values
  namespace: node-feature-discovery
  files:
  - values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
