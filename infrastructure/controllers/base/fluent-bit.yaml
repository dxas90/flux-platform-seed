apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fluent-bit
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: generic-apps
    namespace: flux-system
  path: ./apps/fluent-bit
  targetNamespace: observability
  prune: true
  dependsOn:
    - name: loki
  patches:
    - target:
        kind: HelmRelease
        name: fluent-bit
      patch: |
        - op: add
          path: /spec/valuesFrom/-
          value:
            kind: ConfigMap
            name: fluent-bit-overrides
