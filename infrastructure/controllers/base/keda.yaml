apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keda
  namespace: flux-system
spec:
  interval: 30m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: generic-apps
    namespace: flux-system
  path: ./apps/keda
  targetNamespace: keda
  prune: true
  patches:
    - target:
        kind: HelmRelease
        name: keda
      patch: |
        - op: add
          path: /spec/valuesFrom/-
          value:
            kind: ConfigMap
            name: keda-overrides
