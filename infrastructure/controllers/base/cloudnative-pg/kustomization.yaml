apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- source.yaml
- helmrelease.yaml
configMapGenerator:
- name: cloudnative-pg-values
  namespace: cnpg-system
  files:
  - values.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
