# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: keda
spec:
  interval: 30m
  timeout: 10m
  releaseName: keda
  maxHistory: 3
  install:
    remediation:
      retries: 3
    crds: CreateReplace
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
    crds: CreateReplace
  valuesFrom:
  - kind: ConfigMap
    name: keda-values
  chart:
    spec:
      chart: keda
      version: 2.21.0
      sourceRef:
        kind: HelmRepository
        name: keda
