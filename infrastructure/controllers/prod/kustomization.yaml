apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
configMapGenerator:
- name: alloy-overrides
  namespace: observability
  files:
  - values.yaml=values/alloy.yaml
- name: argocd-overrides
  namespace: argocd
  files:
  - values.yaml=values/argocd.yaml
- name: cert-manager-overrides
  namespace: cert-manager
  files:
  - values.yaml=values/cert-manager.yaml
- name: cloudnative-pg-overrides
  namespace: cnpg-system
  files:
  - values.yaml=values/cloudnative-pg.yaml
- name: dragonfly-operator-overrides
  namespace: dragonfly-system
  files:
  - values.yaml=values/dragonfly-operator.yaml
- name: external-dns-overrides
  namespace: external-dns
  files:
  - values.yaml=values/external-dns.yaml
- name: external-secrets-overrides
  namespace: external-secrets
  files:
  - values.yaml=values/external-secrets.yaml
- name: fluent-bit-overrides
  namespace: observability
  files:
  - values.yaml=values/fluent-bit.yaml
- name: grafana-operator-overrides
  namespace: observability
  files:
  - values.yaml=values/grafana-operator.yaml
- name: keda-overrides
  namespace: keda
  files:
  - values.yaml=values/keda.yaml
- name: kube-prometheus-stack-overrides
  namespace: observability
  files:
  - values.yaml=values/kube-prometheus-stack.yaml
- name: kyverno-overrides
  namespace: kyverno
  files:
  - values.yaml=values/kyverno.yaml
- name: loki-overrides
  namespace: observability
  files:
  - values.yaml=values/loki.yaml
- name: metrics-server-overrides
  namespace: kube-system
  files:
  - values.yaml=values/metrics-server.yaml
- name: node-feature-discovery-overrides
  namespace: node-feature-discovery
  files:
  - values.yaml=values/node-feature-discovery.yaml
- name: reloader-overrides
  namespace: kube-system
  files:
  - values.yaml=values/reloader.yaml
- name: tempo-overrides
  namespace: observability
  files:
  - values.yaml=values/tempo.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
