apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
configMapGenerator:
- name: alloy-overrides
  namespace: observability
  files:
  - values.yaml=values/alloy.yaml
- name: argocd-overrides
  namespace: argocd
  files:
  - values.yaml=values/argocd.yaml
- name: cert-manager-overrides
  namespace: cert-manager
  files:
  - values.yaml=values/cert-manager.yaml
- name: cloudnative-pg-overrides
  namespace: cnpg-system
  files:
  - values.yaml=values/cloudnative-pg.yaml
- name: dragonfly-operator-overrides
  namespace: dragonfly-system
  files:
  - values.yaml=values/dragonfly-operator.yaml
- name: external-dns-overrides
  namespace: external-dns
  files:
  - values.yaml=values/external-dns.yaml
- name: external-secrets-overrides
  namespace: external-secrets
  files:
  - values.yaml=values/external-secrets.yaml
- name: fluent-bit-overrides
  namespace: observability
  files:
  - values.yaml=values/fluent-bit.yaml
- name: grafana-operator-overrides
  namespace: observability
  files:
  - values.yaml=values/grafana-operator.yaml
- name: keda-overrides
  namespace: keda
  files:
  - values.yaml=values/keda.yaml
- name: kube-prometheus-stack-overrides
  namespace: observability
  files:
  - values.yaml=values/kube-prometheus-stack.yaml
- name: kyverno-overrides
  namespace: kyverno
  files:
  - values.yaml=values/kyverno.yaml
- name: loki-overrides
  namespace: observability
  files:
  - values.yaml=values/loki.yaml
- name: metrics-server-overrides
  namespace: kube-system
  files:
  - values.yaml=values/metrics-server.yaml
- name: node-feature-discovery-overrides
  namespace: node-feature-discovery
  files:
  - values.yaml=values/node-feature-discovery.yaml
- name: reloader-overrides
  namespace: kube-system
  files:
  - values.yaml=values/reloader.yaml
- name: tempo-overrides
  namespace: observability
  files:
  - values.yaml=values/tempo.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
patches:
- target:
    kind: HelmRelease
    name: alloy
  patch: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: alloy
      namespace: observability
    spec:
      valuesFrom:
      - kind: ConfigMap
        name: alloy-values
      - kind: ConfigMap
        name: alloy-overrides
- target:
    kind: HelmRelease
    name: argocd
  patch: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: argocd
      namespace: argocd
    spec:
      valuesFrom:
      - kind: ConfigMap
        name: argocd-values
      - kind: ConfigMap
        name: argocd-overrides
- target:
    kind: HelmRelease
    name: cert-manager
  patch: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: cert-manager
      namespace: cert-manager
    spec:
      valuesFrom:
      - kind: ConfigMap
        name: cert-manager-values
      - kind: ConfigMap
        name: cert-manager-overrides
- target:
    kind: HelmRelease
    name: cloudnative-pg
  patch: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: cloudnative-pg
      namespace: cnpg-system
    spec:
      valuesFrom:
      - kind: ConfigMap
        name: cloudnative-pg-values
      - kind: ConfigMap
        name: cloudnative-pg-overrides
- target:
    kind: HelmRelease
    name: dragonfly-operator
  patch: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: dragonfly-operator
      namespace: dragonfly-system
    spec:
      valuesFrom:
      - kind: ConfigMap
        name: dragonfly-operator-values
      - kind: ConfigMap
        name: dragonfly-operator-overrides
- target:
    kind: HelmRelease
    name: external-dns
  patch: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: external-dns
      namespace: external-dns
    spec:
      valuesFrom:
      - kind: ConfigMap
        name: external-dns-values
      - kind: ConfigMap
        name: external-dns-overrides
- target:
    kind: HelmRelease
    name: external-secrets
  patch: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: external-secrets
      namespace: external-secrets
    spec:
      valuesFrom:
      - kind: ConfigMap
        name: external-secrets-values
      - kind: ConfigMap
        name: external-secrets-overrides
- target:
    kind: HelmRelease
    name: fluent-bit
  patch: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: fluent-bit
      namespace: observability
    spec:
      valuesFrom:
      - kind: ConfigMap
        name: fluent-bit-values
      - kind: ConfigMap
        name: fluent-bit-overrides
- target:
    kind: HelmRelease
    name: grafana-operator
  patch: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: grafana-operator
      namespace: observability
    spec:
      valuesFrom:
      - kind: ConfigMap
        name: grafana-operator-values
      - kind: ConfigMap
        name: grafana-operator-overrides
- target:
    kind: HelmRelease
    name: keda
  patch: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: keda
      namespace: keda
    spec:
      valuesFrom:
      - kind: ConfigMap
        name: keda-values
      - kind: ConfigMap
        name: keda-overrides
- target:
    kind: HelmRelease
    name: kube-prometheus-stack
  patch: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: kube-prometheus-stack
      namespace: observability
    spec:
      valuesFrom:
      - kind: ConfigMap
        name: kube-prometheus-stack-values
      - kind: ConfigMap
        name: kube-prometheus-stack-overrides
- target:
    kind: HelmRelease
    name: kyverno
  patch: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: kyverno
      namespace: kyverno
    spec:
      valuesFrom:
      - kind: ConfigMap
        name: kyverno-values
      - kind: ConfigMap
        name: kyverno-overrides
- target:
    kind: HelmRelease
    name: loki
  patch: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: loki
      namespace: observability
    spec:
      valuesFrom:
      - kind: ConfigMap
        name: loki-values
      - kind: ConfigMap
        name: loki-overrides
- target:
    kind: HelmRelease
    name: metrics-server
  patch: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: metrics-server
      namespace: kube-system
    spec:
      valuesFrom:
      - kind: ConfigMap
        name: metrics-server-values
      - kind: ConfigMap
        name: metrics-server-overrides
- target:
    kind: HelmRelease
    name: node-feature-discovery
  patch: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: node-feature-discovery
      namespace: node-feature-discovery
    spec:
      valuesFrom:
      - kind: ConfigMap
        name: node-feature-discovery-values
      - kind: ConfigMap
        name: node-feature-discovery-overrides
- target:
    kind: HelmRelease
    name: reloader
  patch: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: reloader
      namespace: kube-system
    spec:
      valuesFrom:
      - kind: ConfigMap
        name: reloader-values
      - kind: ConfigMap
        name: reloader-overrides
- target:
    kind: HelmRelease
    name: tempo
  patch: |
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: tempo
      namespace: observability
    spec:
      valuesFrom:
      - kind: ConfigMap
        name: tempo-values
      - kind: ConfigMap
        name: tempo-overrides
