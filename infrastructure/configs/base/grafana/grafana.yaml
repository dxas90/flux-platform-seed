apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: observability
  labels:
    dashboards: grafana
    app.kubernetes.io/name: grafana
spec:
  config:
    log:
      mode: console
    auth:
      disable_login_form: 'false'
    auth.anonymous:
      enabled: 'false'
  persistentVolumeClaim:
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
  deployment:
    spec:
      strategy:
        type: Recreate
