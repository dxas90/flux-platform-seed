# PriorityClasses for the platform.
#
# platform-critical: for controllers whose failure blocks everything else (cert-manager,
#   external-secrets, ingress, monitoring operators). Set priorityClassName in their values.
# tenant-standard: for business workloads. Reference it from tenant charts explicitly.
#
# Neither class is globalDefault, so installing them changes nothing until a workload opts in.
# Kubernetes reserves values above 1000000000 for system-cluster-critical/system-node-critical.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: platform-critical
value: 1000000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: Platform infrastructure controllers.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: tenant-standard
value: 1000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: Tenant application workloads.
