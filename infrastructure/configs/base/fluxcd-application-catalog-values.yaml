apiVersion: v1
kind: ConfigMap
metadata:
  name: fluxcd-application-catalog-values
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
data:
  values.yaml: |
    controlNamespace: flux-system
    previewNamespace: flux-previews
    previewTokenSecret: gitlab-token-readonly
    defaults:
      targetRevision: main
      interval: 10m
      retryInterval: 2m
      timeout: 5m
      install:
        remediation:
          retries: 3
      upgrade:
        remediation:
          retries: 3
      preview:
        requeueAfterSeconds: 600
        sourceInterval: 1h
        filterLabel: deploy/flux-preview
    apps: []
