apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
configMapGenerator:
  - name: fluxcd-application-catalog-values
    namespace: flux-system
    behavior: replace
    files:
      - values.yaml=fluxcd-apps-catalog-values.yaml
