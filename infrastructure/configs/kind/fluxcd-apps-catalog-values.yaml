controlNamespace: flux-system
previewNamespace: flux-previews
previewTokenSecret: gitlab-token-readonly
defaults:
  targetRevision: main
  interval: 10m
  timeout: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  preview:
    requeueAfterSeconds: 600
    sourceInterval: 1h
    filterLabel: deploy/flux-preview
apps:
  # GitHub preview blocks are retained as catalog metadata. The Flux chart
  # currently generates MR previews for GitLab only; these entries reconcile
  # their stable releases without GitHub preview resources.
  - name: learn-go
    repo: https://github.com/dxas90/learn-go.git
    chart: k8s/chart
    registry: ghcr.io/dxas90/learn-go
    extraValues:
      env:
        variables:
          APP_ENV: "production"
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
    preview:
      github: {}
  - name: learn-java
    repo: https://github.com/dxas90/learn-java.git
    chart: k8s/learn-java
    registry: ghcr.io/dxas90/learn-java
    extraValues:
      env:
