suite: Preview ResourceSet and InputProvider generation
templates:
  - templates/preview-inputprovider.yaml
  - templates/preview-resourceset.yaml
  - templates/preview-rbac.yaml

tests:
  - it: passes app chart overrides to previews without changing the MR image tag
    template: templates/preview-resourceset.yaml
    set:
      apps:
        - name: my-app
          repo: https://gitlab.com/org/my-app.git
          chart: k8s/chart
          registry: registry.gitlab.com/org/my-app
          extraValues:
            podSecurityContext:
              seccompProfile:
                type: RuntimeDefault
            securityContext:
              allowPrivilegeEscalation: false
          preview:
            gitlab: {}
    asserts:
      - equal:
          path: spec.resources[5].spec.values.securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.resources[5].spec.values.podSecurityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.resources[5].spec.values.image.tag
          value: << inputs.sha >>

  - it: generates no preview resources when preview block is absent
    set:
      apps:
        - name: my-app
          repo: https://gitlab.com/org/my-app.git
          chart: k8s/chart
          registry: registry.gitlab.com/org/my-app
    asserts:
      - hasDocuments:
          count: 0
        template: templates/preview-inputprovider.yaml
      - hasDocuments:
          count: 0
        template: templates/preview-resourceset.yaml
      - hasDocuments:
          count: 0
        template: templates/preview-rbac.yaml

  - it: generates no preview resources when preview.enabled is false
    set:
      apps:
        - name: my-app
          repo: https://gitlab.com/org/my-app.git
          chart: k8s/chart
          registry: registry.gitlab.com/org/my-app
          preview:
            enabled: false
            gitlab: {}
    asserts:
      - hasDocuments:
          count: 0
        template: templates/preview-inputprovider.yaml
      - hasDocuments:
          count: 0
        template: templates/preview-resourceset.yaml
      - hasDocuments:
          count: 0
        template: templates/preview-rbac.yaml

  - it: generates no preview resources when only preview.github is set (not supported)
    set:
      apps:
        - name: my-app
          repo: https://github.com/org/my-app.git
          chart: k8s/chart
          registry: ghcr.io/org/my-app
          preview:
            github: {}
    asserts:
      - hasDocuments:
          count: 0
        template: templates/preview-inputprovider.yaml
      - hasDocuments:
          count: 0
        template: templates/preview-resourceset.yaml
      - hasDocuments:
          count: 0
        template: templates/preview-rbac.yaml

  - it: generates 1 InputProvider, 1 ResourceSet, 5 RBAC docs for one gitlab app
    set:
      apps:
        - name: my-app
          repo: https://gitlab.com/org/my-app.git
          chart: k8s/chart
          registry: registry.gitlab.com/org/my-app
          preview:
            gitlab: {}
    asserts:
      - hasDocuments:
          count: 1
        template: templates/preview-inputprovider.yaml
      - hasDocuments:
          count: 1
        template: templates/preview-resourceset.yaml
      - hasDocuments:
          count: 3
        template: templates/preview-rbac.yaml

  - it: github app generates no preview; gitlab app generates full set
    set:
      apps:
        - name: github-app
          repo: https://github.com/org/github-app.git
          chart: k8s/chart
          registry: ghcr.io/org/github-app
          preview:
            github: {}
        - name: gitlab-app
          repo: https://gitlab.com/org/gitlab-app.git
          chart: k8s/chart
          registry: registry.gitlab.com/org/gitlab-app
          preview:
            gitlab: {}
    asserts:
      - hasDocuments:
          count: 1
        template: templates/preview-inputprovider.yaml
      - hasDocuments:
          count: 1
        template: templates/preview-resourceset.yaml
      - hasDocuments:
          count: 3
        template: templates/preview-rbac.yaml

  - it: two gitlab apps generate 2 InputProviders, 2 ResourceSets, 6 RBAC docs
    set:
      apps:
        - name: app-a
          repo: https://gitlab.com/org/app-a.git
          chart: k8s/chart
          registry: registry.gitlab.com/org/app-a
          preview:
            gitlab: {}
        - name: app-b
          repo: https://gitlab.com/org/app-b.git
          chart: k8s/chart
          registry: registry.gitlab.com/org/app-b
          preview:
            gitlab: {}
    asserts:
      - hasDocuments:
          count: 2
        template: templates/preview-inputprovider.yaml
      - hasDocuments:
          count: 2
        template: templates/preview-resourceset.yaml
      - hasDocuments:
          count: 6
        template: templates/preview-rbac.yaml

  - it: stable app gets no previews; one preview app gets full set (1+1+3)
    set:
      apps:
        - name: my-app
          repo: https://gitlab.com/org/my-app.git
          chart: k8s/chart
          registry: registry.gitlab.com/org/my-app
        - name: preview-app
          repo: https://gitlab.com/org/preview-app.git
          chart: k8s/chart
          registry: registry.gitlab.com/org/preview-app
          preview:
            gitlab: {}
    asserts:
      - hasDocuments:
          count: 1
        template: templates/preview-inputprovider.yaml
      - hasDocuments:
          count: 1
        template: templates/preview-resourceset.yaml
      - hasDocuments:
          count: 3
        template: templates/preview-rbac.yaml

  - it: public repo — GitRepository has no secretRef
    templates:
      - templates/preview-resourceset.yaml
    set:
      apps:
        - name: my-app
          repo: https://gitlab.com/org/my-app.git
          chart: k8s/chart
          registry: registry.gitlab.com/org/my-app
          preview:
            gitlab: {}
    # ResourceSet is document 0; GitRepository is the 5th resource inside it
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.resources[4].spec.secretRef

  - it: top-level gitSecretRef propagates to preview GitRepository
    templates:
      - templates/preview-resourceset.yaml
    set:
      apps:
        - name: private-app
          repo: https://gitlab.com/org/private-app.git
          chart: k8s/chart
          registry: registry.gitlab.com/org/private-app
          gitSecretRef: private-app-clone-creds
          preview:
            gitlab: {}
    documentIndex: 0
    asserts:
      - equal:
          path: spec.resources[4].spec.secretRef.name
          value: private-app-clone-creds

  - it: preview.gitSecretRef overrides top-level gitSecretRef
    templates:
      - templates/preview-resourceset.yaml
    set:
      apps:
        - name: private-app
          repo: https://gitlab.com/org/private-app.git
          chart: k8s/chart
          registry: registry.gitlab.com/org/private-app
          gitSecretRef: top-level-creds
          preview:
            gitlab: {}
            gitSecretRef: preview-only-creds
    documentIndex: 0
    asserts:
      - equal:
          path: spec.resources[4].spec.secretRef.name
          value: preview-only-creds
