suite: Namespace generation
templates:
  - templates/namespace.yaml

tests:
  - it: generates one Namespace per app
    set:
      apps:
        - name: my-app
          repo: https://gitlab.com/org/my-app.git
          chart: k8s/chart
          registry: registry.gitlab.com/org/my-app
        - name: other-app
          repo: https://gitlab.com/org/other-app.git
          chart: k8s/chart
          registry: registry.gitlab.com/org/other-app
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: Namespace

  - it: sets Pod Security Standard labels to restricted
    set:
      apps:
        - name: my-app
          repo: https://gitlab.com/org/my-app.git
          chart: k8s/chart
          registry: registry.gitlab.com/org/my-app
    asserts:
      - equal:
          path: metadata.labels["pod-security.kubernetes.io/enforce"]
          value: restricted
      - equal:
          path: metadata.labels["pod-security.kubernetes.io/audit"]
          value: restricted

  - it: sets prune-disabled annotation
    set:
      apps:
        - name: my-app
          repo: https://gitlab.com/org/my-app.git
          chart: k8s/chart
          registry: registry.gitlab.com/org/my-app
    asserts:
      - equal:
          path: metadata.annotations["kustomize.toolkit.fluxcd.io/prune"]
          value: "disabled"

  - it: uses the app name as namespace name
    set:
      apps:
        - name: example-app
          repo: https://git.example.invalid/org/example-app.git
          chart: k8s/chart
          registry: registry.example.invalid/org/example-app
    asserts:
      - equal:
          path: metadata.name
          value: example-app
